# Canon Camera workspace — install first-party wheels from the local PyPI server.
# Install to /etc/pip.conf on target devices. See client-config/README.md.
#
# This REPLACES the stock Raspberry Pi OS /etc/pip.conf but re-includes piwheels,
# so the three indexes pip uses are: PyPI (default), piwheels (ARM prebuilt wheels
# for dependencies), and the local server (first-party wheels like cc-client).
[global]
extra-index-url =
    https://www.piwheels.org/simple
    http://pihost-002.local:8080/simple/
trusted-host = pihost-002.local
